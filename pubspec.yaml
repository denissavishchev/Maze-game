name: orbyrinth
description: "Orbyrinth: tilt the phone and roll the ball through round mazes."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  sensors_plus: ^7.1.1
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:

  uses-material-design: true

  assets:
    - assets/images/


flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#4C9A2A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#1F3322"
    theme_color: "#4C9A2A"
  macos:
    generate: true
    image_path: assets/icon/icon.png


flutter_native_splash:
  color: "#1F3322"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#1F3322"
    image: assets/icon/icon_foreground.png
    icon_background_color: "#4C9A2A"
